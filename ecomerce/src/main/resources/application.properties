# All secrets and environment-specific values come from environment variables.
# See .env.example at the repo root for the full list.
server.port=${PORT:8084}
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:Ecomerce}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Public URL of the site, used for Stripe redirects and links in emails.
# Render sets RENDER_EXTERNAL_URL automatically.
app.base-url=${APP_BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:4200}}
app.jwt.secret=${JWT_SECRET:}
app.stripe.secret-key=${STRIPE_SECRET_KEY:}

# Email is optional. Without it, new accounts are active immediately.
# Setting BREVO_API_KEY sends through Brevo's HTTPS API, which works on Render's free plan.
# MAIL_ENABLED=true sends through SMTP instead, which Render's free plan blocks.
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
